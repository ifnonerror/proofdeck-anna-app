<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ProofDeck</title>
    <link rel="icon" href="./assets/proofdeck-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">P</span>
        <div>
          <strong>ProofDeck</strong>
          <span>Source-grounded presentations</span>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="mode-badge" class="badge">Fixture preview</span>
        <span id="quota-badge" class="badge" hidden></span>
        <button id="new-project" class="button secondary" type="button">New project</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel brief-panel" aria-label="Brief and source material">
        <section class="panel-section">
          <div class="section-heading">
            <h2>Brief</h2>
            <span class="subtle">One deck, one argument</span>
          </div>
          <label>
            Topic or request
            <textarea id="brief-topic" rows="3" placeholder="例如：把 Q3 业务复盘整理成 8 页管理层决策汇报"></textarea>
          </label>
          <div class="field-grid">
            <label>
              Audience
              <input id="brief-audience" type="text" placeholder="管理层" />
            </label>
            <label>
              Purpose
              <input id="brief-purpose" type="text" placeholder="评审并做决策" />
            </label>
          </div>
          <div class="field-grid three">
            <label>
              Language
              <select id="brief-language">
                <option value="zh-CN">中文</option>
                <option value="en">English</option>
              </select>
            </label>
            <label>
              Slides
              <select id="brief-slides">
                <option>6</option>
                <option selected>8</option>
                <option>10</option>
              </select>
            </label>
            <label>
              Tone
              <select id="brief-tone">
                <option value="executive">Executive</option>
                <option value="analytical">Analytical</option>
                <option value="persuasive">Persuasive</option>
                <option value="educational">Educational</option>
              </select>
            </label>
          </div>
          <label>
            Model preference
            <select id="brief-model">
              <option value="auto">Auto · platform default</option>
              <option value="claude-sonnet-4.5">Claude Sonnet 4.5 · quality</option>
              <option value="gemini-3.5-flash">Gemini 3.5 Flash · balanced</option>
              <option value="gpt-5-mini">GPT-5 Mini · concise</option>
              <option value="qwen3.8-flash">Qwen3.8 Flash · economy</option>
            </select>
            <small class="model-note">Anna may use your account default. The actual model is shown after generation.</small>
          </label>
          <label>
            Source material
            <textarea id="source-text" rows="12" placeholder="粘贴会议纪要、周报、论文摘要或项目材料。每个段落会自动编号为 S1、S2…"></textarea>
          </label>
          <div class="button-row">
            <button id="generate" class="button primary" type="button">Generate with Anna AI</button>
            <button id="load-example" class="button secondary" type="button">Load example</button>
          </div>
          <p id="generation-status" class="status" role="status" aria-live="polite"></p>
        </section>

        <section class="panel-section">
          <div class="section-heading">
            <h2>Sources</h2>
            <span id="source-count" class="subtle">0 units</span>
          </div>
          <div id="sources" class="source-list"></div>
        </section>
      </aside>

      <section class="panel editor-panel" aria-label="Presentation outline and editor">
        <div class="section-heading sticky-heading">
          <div>
            <h2>Storyboard</h2>
            <span id="deck-title-label" class="subtle">Untitled deck</span>
          </div>
          <div class="view-switch" role="tablist" aria-label="Editor view">
            <button id="tab-edit" class="tab active" type="button" role="tab">Edit</button>
            <button id="tab-preview" class="tab" type="button" role="tab">Preview</button>
          </div>
        </div>

        <div id="edit-view">
          <label>
            Deck title
            <input id="deck-title" type="text" />
          </label>
          <label>
            Deck subtitle
            <input id="deck-subtitle" type="text" />
          </label>
          <ol id="outline" class="outline"></ol>
          <div class="add-slide-row">
            <select id="new-slide-kind" aria-label="New slide type">
              <option value="bullets">Key points</option>
              <option value="comparison">Comparison</option>
              <option value="metrics">Metrics</option>
              <option value="timeline">Timeline</option>
              <option value="section">Section</option>
            </select>
            <button id="add-slide" class="button secondary" type="button">Add slide</button>
          </div>

          <div id="slide-editor"></div>
        </div>
      </section>

      <section id="preview-panel" class="panel preview-panel" aria-label="Slide preview and export">
        <div class="preview-head">
          <div>
            <h2>Preview</h2>
            <span id="preview-caption" class="subtle">Executive theme</span>
          </div>
          <select id="theme-select" aria-label="Presentation theme">
            <option value="executive">Executive</option>
            <option value="minimal">Minimal</option>
            <option value="signal">Signal</option>
          </select>
        </div>
        <div id="slide-preview" class="slide-preview"></div>
        <div class="preview-meta">
          <span id="slide-position" class="subtle">1 / 1</span>
          <span id="save-status" class="subtle">Not saved</span>
        </div>
        <div class="export-card">
          <h3>Export PowerPoint</h3>
          <p>Text, shapes, line breaks and speaker notes remain editable in PowerPoint or WPS.</p>
          <button id="export" class="button primary full" type="button">Export PPTX</button>
          <p id="export-status" class="status" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
  </body>
</html>
